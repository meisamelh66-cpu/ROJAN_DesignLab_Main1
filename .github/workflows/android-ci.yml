name: Android CI (unit tests)

# Trunk-agnostic by design: Android branch authority (main vs.
# feature/android-first-salon-pilot) is an open owner decision, not yet
# approved. This workflow does not presuppose an answer - pull_request has
# no base-branch filter (it runs for a PR targeting either line, or any
# future integration branch), and push explicitly covers both current
# candidates so neither line goes CI-blind while the decision is pending.
# Update the push branch list, not the overall design, once that decision
# is made.
on:
  pull_request: {}
  push:
    branches:
      - main
      - feature/android-first-salon-pilot

jobs:
  unit-tests:
    name: Unit tests (Customer, Manager, Reception)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Provides ANDROID_HOME/ANDROID_SDK_ROOT - local.properties' sdk.dir
      # is gitignored/per-machine and deliberately not relied on here;
      # confirmed locally that a clean checkout with no local.properties
      # compiles and runs the full unit-test suite correctly as long as
      # these env vars are set, exactly as this action sets them.
      #
      # v3 fails on current ubuntu-latest runners: "Warning: Failed to find
      # package 'tools'" -> sdkmanager exits 1 (android-actions/setup-android
      # issue #537 - the action still tried to install Google's long-removed
      # legacy `tools` package). Fixed upstream in PR #538, which landed in
      # v4.0.4, not in any v3.x or even v4.0.0 (confirmed via the GitHub API
      # compare endpoint before pinning this) - v3 cannot be patched around,
      # v4 is required. Observed failing in this PR's own first real CI run,
      # fixed here, not a precautionary bump.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --continue: run every flavor's suite to completion and report all
      # failures together, rather than stopping at the first one - this
      # does not weaken the gate, the job still fails overall if any test
      # fails, it only improves what a contributor sees in one CI run.
      - name: Run unit tests (Customer/Manager/Reception, dev/debug)
        run: >
          ./gradlew
          testCustomerDevDebugUnitTest
          testManagerDevDebugUnitTest
          testReceptionDevDebugUnitTest
          --no-daemon --max-workers=1 --console=plain --continue

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

  # Pass 62: report-only OWASP Dependency-Check baseline, mirroring ROJAN_Backend's own already-
  # proven job/config shape exactly (same plugin version, same report-only failBuildOnCVSS=11.0f
  # policy, same NVD-data cache strategy) rather than inventing a new one. Separate job from
  # unit-tests so its own exit code is never masked by, or confused with, the test job's result.
  dependency-check-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute cache week
        id: week
        run: echo "value=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD data feed
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: nvd-data-${{ steps.week.outputs.value }}
          restore-keys: |
            nvd-data-
      - name: OWASP Dependency-Check (report-only baseline)
        # --no-configuration-cache: the dependencyCheckAnalyze task's own `Analyze` type is not
        # configuration-cache-compatible (it calls `Task.project` at execution time and tries to
        # serialize `DefaultProject` into the cache entry - both unsupported) - confirmed from this
        # job's own real run logs ("cannot serialize object of type 'DefaultProject'", "invocation
        # of 'Task.project' at execution time is unsupported with the configuration cache"). This
        # flag only disables the configuration cache for this one invocation; it does not touch the
        # NVD-update path at all - a separate, still-open issue (NvdApiRetryExceededException /
        # Invalid API Key, observed independently in this job's own real logs) that this change
        # does not claim to fix.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # TEMP DIAGNOSTIC: --info, redirected to a file and grepped for the plugin's own
        # test-configuration classification lines only (configuration names, never dependency
        # names/versions/secrets). Paired with a temporary autoUpdate=false in build.gradle.kts
        # (see there) to skip the ~3h25m NVD sync for this one diagnostic run. Must be reverted,
        # together with that build.gradle.kts change, once this diagnostic run completes.
        run: |
          set +e
          ./gradlew dependencyCheckAnalyze --no-daemon --console=plain --no-parallel --no-configuration-cache --info > /tmp/dc_info.log 2>&1
          EXIT=$?
          echo "gradlew exit code: $EXIT"
          echo
          echo "=== lines where the plugin classifies a configuration as a test configuration (configuration names only) ==="
          grep -i "is considered a test configuration" /tmp/dc_info.log | sed -E 's/^[^ ]+ +[^ ]+ +//' || echo "(no matches)"
          echo
          echo "=== final analyze outcome line(s), if present ==="
          grep -iE "Found [0-9]+ vulnerabilities|BUILD SUCCESSFUL|BUILD FAILED|^> Task :dependencyCheckAnalyze" /tmp/dc_info.log | tail -10
          echo
          echo "=== why it failed with autoUpdate=false (exception/error context only) ==="
          grep -A 8 "^\* What went wrong:" /tmp/dc_info.log
          echo "--- caused-by chain ---"
          grep "^Caused by:" /tmp/dc_info.log
          exit 0

      - name: Locate dependency-check reports
        if: always()
        run: |
          echo "Dependency-Check report files found anywhere in the workspace:"
          find . -type f \( -iname 'dependency-check-report.html' -o -iname 'dependency-check-report.json' \) -print || true
          echo "(if nothing was printed above, no matching report file exists anywhere in the workspace)"

      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/dependency-check-report.html
            **/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
